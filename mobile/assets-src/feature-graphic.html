<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Martian+Mono:wght@700&family=Schibsted+Grotesk:wght@800&display=swap" rel="stylesheet">
<style>*{margin:0;box-sizing:border-box}body{width:1024px;height:500px;background:#141519;color:#ECE8DF;font-family:'Schibsted Grotesk';overflow:hidden;position:relative}
.m{position:absolute;left:58px;top:70px;width:330px;height:330px}
.t{position:absolute;left:430px;top:84px}
.tape{display:inline-block;background:#C5F04A;color:#141519;font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:22px;padding:6px 26px 4px 14px;transform:rotate(-1.2deg);clip-path:polygon(0 0,100% 0,97% 22%,100% 45%,96.5% 70%,100% 100%,0 100%)}
h1{font-family:'Dela Gothic One';font-weight:400;font-size:58px;line-height:1.04;margin-top:22px;white-space:nowrap}
.r{position:absolute;left:430px;right:56px;bottom:62px;display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.r i{font-style:normal;height:52px;display:grid;place-items:center;font-family:'Martian Mono';font-weight:700;font-size:20px;background:#1D1F25;color:#8E8F98;border-bottom:5px solid #2B2E36}
.r i.d{border-bottom-color:#FF4F8B;color:#ECE8DF}.r i.o{background:#ECE8DF;color:#141519;border-bottom-color:#FF4F8B}</style></head>
<body><svg class="m" viewBox="0 0 600 620">
  <!-- RUKH mark: an R laid out of square-cut spike tape on the marley floor. Chalk strips, pink leg with a torn end. -->
  <g fill="#ECE8DF">
    <!-- stem -->
    <polygon points="118,64 226,62 232,546 124,548" transform="rotate(-1.2 175 300)"/>
    <!-- top strip, torn right end -->
    <polygon points="112,62 420,58 410,84 424,108 408,134 422,160 116,166" transform="rotate(1.5 270 110)"/>
    <!-- bowl side -->
    <polygon points="372,96 470,104 462,318 364,312" transform="rotate(2 418 208)"/>
    <!-- middle strip -->
    <polygon points="118,262 450,272 446,366 114,358" transform="rotate(-1.2 280 312)"/>
  </g>
  <!-- leg: pink tape, torn bottom end -->
  <polygon fill="#FF4F8B" points="236,330 346,322 512,528 494,534 506,552 484,560 492,580 394,586" />
  <!-- floor notch: cyan, the second dancer's tape -->
  <polygon fill="#3DD6F5" points="60,574 250,568 242,588 252,606 60,604" transform="rotate(-1.2 150 588)"/>
</svg>
<div class="t"><span class="tape">Dance battle · 1–4 dancers</span><h1>Phone films.<br>Screen counts.</h1></div>
<div class="r"><i class="d">1</i><i class="d">2</i><i class="d">3</i><i class="d">4</i><i class="o">5</i><i>6</i><i>7</i><i>8</i></div></body></html>
